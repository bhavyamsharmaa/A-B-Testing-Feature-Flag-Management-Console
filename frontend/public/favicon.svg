<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Helios">
  <title>Helios</title>
  <defs>
    <linearGradient id="helios-g" x1="1" y1="0" x2="63" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- the toggle track -->
  <rect x="1" y="16" width="62" height="32" rx="16" fill="url(#helios-g)"/>
  <!-- the sun: a solid circle at the "on" end, ringed in the track gradient so it holds up on light backgrounds -->
  <circle cx="45.5" cy="32" r="16" fill="#fff" stroke="url(#helios-g)" stroke-width="3.5"/>
</svg>
