<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Helios">
  <title>Helios</title>
  <defs>
    <mask id="helios-m">
      <rect width="64" height="64" fill="#000"/>
      <rect x="1" y="16" width="62" height="32" rx="16" fill="#fff"/>
      <!-- the gap between the sun and the track -->
      <circle cx="45.5" cy="32" r="19.5" fill="#000"/>
    </mask>
  </defs>
  <!-- the toggle track, with the sun's gap cut out -->
  <rect width="64" height="64" fill="#fff" mask="url(#helios-m)"/>
  <!-- the sun -->
  <circle cx="45.5" cy="32" r="16" fill="#fff"/>
</svg>
