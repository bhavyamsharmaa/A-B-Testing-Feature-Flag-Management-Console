# Weekly dependency update pull requests, a few at a time. Nothing is merged
# automatically: every update is a pull request that CI checks and a person reviews.
# GitHub reads this file from the default branch only, so it starts after release 1 is merged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
