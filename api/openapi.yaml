openapi: 3.1.0
info:
  title: Helios API
  version: 0.3.0
  description: >-
    Shared contract for the Helios control plane (flag CRUD, RBAC, audit) and
    data plane (flag evaluation). This file is the source of truth for the API
    shape: backend handlers under /backend and the frontend API client under
    /frontend are both expected to conform to it.

    Control-plane routes take a Supabase Auth access token. Data belongs to a
    workspace; a user can belong to several, with a role in each (owner > admin
    > editor > viewer). Routes with {envId} or {wsId} resolve it through the
    caller's own membership: anything the caller is not a member of answers 404,
    never 403, so ids can't be probed. Every non-2xx JSON response has the
    Error shape.
servers:
  - url: https://TODO-your-render-service.onrender.com
    description: Production (Render)
  - url: http://localhost:8080
    description: Local development (Go backend)

tags:
  - name: system
  - name: control-plane
  - name: data-plane
  - name: webhooks

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe — 200 only if the database is reachable
      security: []
      responses:
        "200":
          description: Service is up and the database answered a ping
          content:
            text/plain:
              schema: { type: string, example: ok }
        "503":
          description: Database unreachable
          content:
            text/plain:
              schema: { type: string, example: db unreachable }

  /me:
    get:
      tags: [control-plane]
      summary: The current user, their workspaces and open invites
      description: >-
        The first call for a user creates their personal workspace (dev,
        staging and production environments, the user as owner). The first
        workspace listed is the active one (most recently used).
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workspaces:
    get:
      tags: [control-plane]
      summary: The caller's workspaces (same data as in /me)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Workspaces, most recently used first
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [control-plane]
      summary: Create a workspace owned by the caller, and switch to it
      description: >-
        Created with dev, staging and production environments. A user owns at
        most 5 workspaces (409 QUOTA_EXCEEDED beyond that).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    patch:
      tags: [control-plane]
      summary: Rename the workspace (admin+)
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/{wsId}/switch:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    post:
      tags: [control-plane]
      summary: Make this the caller's active workspace (any member)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Active workspace updated
          content:
            application/json:
              schema:
                type: object
                required: [activeWorkspaceId]
                properties:
                  activeWorkspaceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/{wsId}/members:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: List the workspace's members (any member)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Members, owners first
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/{wsId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [control-plane]
      summary: Change a member's role (admin+)
      description: >-
        Owners can set any role, including owner (hand-over). Admins manage
        everyone except owners and can't create owners. The last owner can't
        be demoted (409 LAST_OWNER).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "200": { description: Role changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or MEMBER_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: LAST_OWNER, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [control-plane]
      summary: Remove a member, or leave the workspace (own id)
      description: >-
        Any member may remove themselves. Removing someone else needs admin,
        and an owner can only be removed by an owner. The last owner can't
        leave or be removed (409 LAST_OWNER).
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or MEMBER_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: LAST_OWNER, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/invites:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: Open invites of the workspace (admin+)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Unexpired, unrevoked, unaccepted invites
          content:
            application/json:
              schema:
                type: object
                required: [invites, email]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
                  email:
                    type: object
                    required: [mode, sent]
                    properties:
                      mode: { type: string, enum: [sink, smtp], description: "sink: emails are NOT actually sent in this environment" }
                      sent: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      tags: [control-plane]
      summary: Invite someone by email (admin+)
      description: >-
        An email with the invite link is queued in the same transaction (and
        sent by the outbox worker; in a development environment mail goes to a
        sink and nothing is actually sent: see `email` in the list response).
        The response also carries the one-time token (only its hash is stored;
        it can't be shown again) so the inviter can copy the link as a fallback.
        It is valid for 7 days and only for that address. At most 3 emails a day
        per address and 50 per workspace (409 QUOTA_EXCEEDED); the response is
        the same whether or not the address already has an account. Members
        plus open invites are capped at 20 (409 QUOTA_EXCEEDED). Invites are
        never for the owner role.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { type: string, enum: [admin, editor, viewer] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  token: { type: string, description: "hinv_… shown once" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { description: "ALREADY_MEMBER, INVITE_EXISTS or QUOTA_EXCEEDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Revoke an open invite (admin+)
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or INVITE_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/invites/{inviteId}/resend:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [control-plane]
      summary: Email an open invite again, with a NEW link (admin+)
      description: >-
        The old token cannot be recovered (only its hash is stored), so a resend
        issues a new one: the earlier link stops working and an earlier email still
        queued is cancelled. At most one email per invite every 10 minutes (429
        RESEND_COOLDOWN with Retry-After). The new token is returned once.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  token: { type: string, description: "hinv_… shown once" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or INVITE_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: QUOTA_EXCEEDED (daily invite emails), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: RESEND_COOLDOWN or RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/webhooks:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [webhooks]
      summary: The workspace's webhook endpoints (admin+, session only)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Endpoints with their health. Never a secret, only its last characters.
          content:
            application/json:
              schema:
                type: object
                required: [endpoints, available, eventTypes, limit]
                properties:
                  endpoints: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } }
                  available: { type: boolean, description: "false when the server has no WEBHOOK_SECRET_KEY: endpoints cannot be created" }
                  eventTypes: { type: array, items: { type: string } }
                  limit: { type: integer, example: 10 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      tags: [webhooks]
      summary: Create an endpoint (admin+, session only)
      description: >-
        The URL must be https on a public host (port 443 or 8443), validated now and again at every
        delivery. The signing secret is returned ONCE. At most 10 endpoints per workspace. 503
        WEBHOOKS_UNAVAILABLE when the server has no encryption key.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventTypes]
              properties:
                url: { type: string, maxLength: 2048 }
                description: { type: string, maxLength: 200 }
                eventTypes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/WebhookEventType" } }
                environmentId: { type: [string, "null"], format: uuid, description: "Only events of this environment; omit for all" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, secret]
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
                  secret: { type: string, description: "whsec_… shown once" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: WEBHOOKS_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/webhooks/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [webhooks]
      summary: Change an endpoint, or enable/disable it (admin+, session only)
      description: Re-enabling clears the failure counters. Every field is optional.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                description: { type: string }
                eventTypes: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
                environmentId: { type: [string, "null"], format: uuid }
                enabled: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or WEBHOOK_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [webhooks]
      summary: Delete an endpoint and its queued deliveries (admin+, session only)
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or WEBHOOK_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/webhooks/{endpointId}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [webhooks]
      summary: Rotate the signing secret (admin+, session only)
      description: The new secret is returned once. The old one keeps signing for 24 hours (both signatures are sent).
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, secret]
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
                  secret: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or WEBHOOK_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: WEBHOOKS_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/webhooks/{endpointId}/test:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [webhooks]
      summary: Send a test ping now (admin+, session only, rate limited)
      description: Works on a disabled endpoint. Returns the delivery record after the attempt.
      security: [{ supabaseJWT: [] }]
      responses:
        "200": { description: The attempt, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or WEBHOOK_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/webhooks/{endpointId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [webhooks]
      summary: The delivery log of an endpoint, newest first (admin+, session only)
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivering, delivered, failed, dead] } }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or WEBHOOK_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/webhooks/{endpointId}/deliveries/{deliveryId}/resend:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [webhooks]
      summary: Send a failed delivery again, with the same delivery id (admin+, session only, rate limited)
      security: [{ supabaseJWT: [] }]
      responses:
        "200": { description: The attempt, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND, WEBHOOK_NOT_FOUND or DELIVERY_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: NOT_RESENDABLE (only failed or dead deliveries), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /internal/outbox/run:
    post:
      tags: [system]
      summary: Run the outbox worker once (machines only)
      description: >-
        Not part of the public API. Needs the X-Helios-Outbox-Secret header; with no OUTBOX_SECRET
        configured it answers 404. Returns counts only.
      security: []
      parameters:
        - { name: X-Helios-Outbox-Secret, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Counts, content: { application/json: { schema: { type: object } } } }
        "401": { description: One fixed answer, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not enabled }
        "429": { description: RATE_LIMITED }

  /workspaces/{wsId}/ownership-offers:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: The workspace's open ownership offer, if any (owner, session only)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: The open offer or null (expired offers are not open)
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { oneOf: [{ $ref: "#/components/schemas/OwnershipOffer" }, { type: "null" }] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      tags: [control-plane]
      summary: Offer ownership to an admin of the workspace (owner, session only)
      description: >-
        The target must be an existing ADMIN of the workspace. They must accept; the offer lasts 7 days and can be cancelled.
        One open offer per workspace (409 OFFER_EXISTS).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: string, format: uuid } } }
      responses:
        "201": { description: Offered, content: { application/json: { schema: { type: object, properties: { offer: { $ref: "#/components/schemas/OwnershipOffer" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or MEMBER_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "TARGET_NOT_ADMIN, ALREADY_OWNER or OFFER_EXISTS", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/ownership-offers/{offerId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Cancel the open ownership offer (owner, session only)
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or OFFER_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /ownership-offers/{offerId}/accept:
    parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [control-plane]
      summary: Accept an offer of ownership (the person it is addressed to, session only)
      description: >-
        One transaction: the caller becomes owner FIRST, then the previous owner becomes an admin, so the workspace never has
        no owner. Everything is checked again: the offer is open and unexpired, the workspace is not scheduled for deletion, the
        offerer is still an owner, the caller is still an admin, and the caller owns fewer than 5 workspaces (409 QUOTA_EXCEEDED).
      security: [{ supabaseJWT: [] }]
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { type: object, properties: { workspaceId: { type: string, format: uuid } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: OFFER_NOT_FOUND (also for an offer addressed to someone else), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "OFFER_NOT_OPEN, OFFER_NO_LONGER_VALID or QUOTA_EXCEEDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: OFFER_EXPIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /ownership-offers/{offerId}/decline:
    parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [control-plane]
      summary: Decline an offer of ownership (the person it is addressed to, session only)
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Declined }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: OFFER_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/schedule-deletion:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    post:
      tags: [control-plane]
      summary: Schedule the workspace for deletion (owner, session only)
      description: >-
        The caller types the workspace's exact name. From that instant the workspace is invisible (404 to every member and every
        API token), SDK keys stop evaluating and their streams close, scheduled changes and webhook/email deliveries stop, and
        invites cannot be accepted. NOTHING is deleted for 14 days: an owner can restore it (POST /workspaces/restore). After that
        cmd/purgeworkspaces removes the data in batches. It still counts toward the owner's 5 owned workspaces until purged.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [confirmName], properties: { confirmName: { type: string } } }
      responses:
        "200": { description: Scheduled, content: { application/json: { schema: { type: object, properties: { workspace: { $ref: "#/components/schemas/PendingDeletion" } } } } } }
        "400": { description: NAME_MISMATCH, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/restore:
    post:
      tags: [control-plane]
      summary: Restore a workspace scheduled for deletion (an owner of it, session only)
      description: A self route, because a workspace scheduled for deletion is invisible to the workspace routes. 410 GRACE_PERIOD_ENDED once the 14 days are over.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [workspaceId], properties: { workspaceId: { type: string, format: uuid } } }
      responses:
        "200": { description: Restored, content: { application/json: { schema: { type: object, properties: { workspaceId: { type: string, format: uuid } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Not a workspace of yours that can be restored, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: GRACE_PERIOD_ENDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /internal/workspaces/purge:
    post:
      tags: [system]
      summary: Purge workspaces whose grace period has ended (machines only)
      description: >-
        Not part of the public API. Needs X-Helios-Purge-Secret; with no PURGE_SECRET configured it answers 404. Removes data in
        bounded, resumable batches and returns counts only.
      security: []
      parameters:
        - { name: X-Helios-Purge-Secret, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Counts, content: { application/json: { schema: { type: object } } } }
        "401": { description: One fixed answer, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not enabled }
        "429": { description: RATE_LIMITED }

  /environments/{envId}/audit-logs/export:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: Export the audit log as CSV or JSON (admin+, session only, rate limited)
      description: >-
        Streams this environment's entries plus the workspace-wide ones for a date range of at most 90 days (default the last 30), at most
        100,000 entries (422 EXPORT_TOO_LARGE otherwise: never silently cut). Cells that begin with = + - @ tab or CR are prefixed with an
        apostrophe (CSV injection). Secret-shaped values are redacted. The export is itself audited.
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: from, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD" }
        - { name: to, in: query, schema: { type: string }, description: "RFC 3339, or YYYY-MM-DD meaning the whole of that day" }
      responses:
        "200": { description: The file (attachment), content: { text/csv: { schema: { type: string } }, application/json: { schema: { type: array, items: { type: object } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: ENVIRONMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: EXPORT_TOO_LARGE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: RATE_LIMITED }

  /environments/{envId}/flags/{key}/history:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    get:
      tags: [control-plane]
      summary: One flag's change history in this environment (any role, session only)
      description: Newest first, paged by entry id. Read only. Shows who (person, API token, or a schedule acting for a person), when (RFC 3339 UTC) and a readable before/after of the fields that changed.
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: "Entry id from nextCursor" }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/FlagHistoryEntry" } }
                  nextCursor: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: ENVIRONMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /invites/accept:
    post:
      tags: [control-plane]
      summary: Accept an invite and join its workspace
      description: >-
        Name the invite by its one-time token, or by the id listed in GET /me
        (invites addressed to the caller's email). The caller's email must be
        the invited address (403 otherwise). The token works once.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of token or inviteId.
              properties:
                token: { type: string }
                inviteId: { type: string, format: uuid }
      responses:
        "200":
          description: Joined; the workspace becomes the active one
          content:
            application/json:
              schema:
                type: object
                required: [workspaceId]
                properties:
                  workspaceId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: INVITE_NOT_FOUND (invalid, used or revoked), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: INVITE_EXPIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/segments:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: List the workspace's segments (any member)
      description: >-
        Segments are workspace-wide: every environment evaluates the same ones.
        The list omits each segment's members (see the single read).
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Segments by key
          content:
            application/json:
              schema:
                type: object
                required: [segments]
                properties:
                  segments:
                    type: array
                    items: { $ref: "#/components/schemas/SegmentSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      tags: [control-plane]
      summary: Create a segment (editor+)
      description: >-
        A subject is in the segment if it is an explicit member OR matches ALL
        of `rules` (rules are ANDed, like the clauses of a flag rule). Rules use
        the flag-rule operators except inSegment and notInSegment: a segment
        cannot reference another segment (400). Limits: 20 segments per
        workspace, 10,000 explicit members per segment (repeats are ignored),
        20 rule clauses and 8,192 bytes of rule definition (409
        QUOTA_EXCEEDED). Member keys are exact, 1-256 characters, with no
        control characters. The body may be up to 4 MiB (413 beyond).
        Audited as segment.create. Segment writes (this route, PATCH and
        DELETE) share a per-user rate limit tighter than the general one (burst
        30, then 1 per second by default): 429 RATE_LIMITED with Retry-After.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentCreateRequest" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Segment" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { description: "SEGMENT_KEY_EXISTS or QUOTA_EXCEEDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: BODY_TOO_LARGE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/segments/{segKey}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - $ref: "#/components/parameters/SegmentKeyPath"
    get:
      tags: [control-plane]
      summary: Read a segment with its members (any member)
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: The segment, members sorted
          content: { application/json: { schema: { $ref: "#/components/schemas/Segment" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SegmentNotFound" }
    patch:
      tags: [control-plane]
      summary: Change a segment (editor+)
      description: >-
        Absent fields are left alone. `members`, when present, REPLACES the
        whole explicit member list. `expectedVersion` makes the update fail
        with 409 STALE_SEGMENT if someone else saved first. A change to the
        rules or the members bumps the version of every flag configuration that
        uses the segment, and tells the SDK streams of the affected
        environments (event `segment_updated`); a rename does neither. An
        update that changes nothing changes nothing (no version bump). Audited
        as segment.update with counts and a short sample of keys, never the
        whole member list.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentUpdateRequest" }
      responses:
        "200":
          description: The segment after the change
          content: { application/json: { schema: { $ref: "#/components/schemas/Segment" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SegmentNotFound" }
        "409": { description: "STALE_SEGMENT or QUOTA_EXCEEDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: BODY_TOO_LARGE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [control-plane]
      summary: Delete a segment (editor+)
      description: >-
        Refused with 409 SEGMENT_IN_USE (naming the flags) while any flag rule
        references the segment, unless `?confirm=true`. A confirmed delete of an
        in-use segment is audited as segment.force_delete (critical); the rules
        that named it stay stored and then match nobody (inSegment and
        notInSegment alike), and the affected flag configurations' versions are
        bumped. A flag rule cannot be saved with a segment that does not exist.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      parameters:
        - { name: confirm, in: query, required: false, schema: { type: boolean } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SegmentNotFound" }
        "409": { description: SEGMENT_IN_USE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/segments/{segKey}/usage:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - $ref: "#/components/parameters/SegmentKeyPath"
    get:
      tags: [control-plane]
      summary: Which flags use a segment (any member)
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: The flags whose rules reference the segment, with the environments
          content: { application/json: { schema: { $ref: "#/components/schemas/SegmentUsage" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SegmentNotFound" }

  /environments/{envId}/flags/{key}/promotions/preview:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    post:
      tags: [control-plane]
      summary: Preview copying this flag's configuration from another environment (any role)
      description: >-
        {envId} is the TARGET. The server compares the flag's configuration in
        `sourceEnvironment` (a key such as staging, or an id; only environments of
        the same workspace resolve) with the target's and returns, per part, whether
        it is selected, whether it differs, and both values. By default `enabled` is
        NOT copied. Writes nothing. `problems` says why the selected parts cannot be
        applied (a rule naming a segment that does not exist, a variation the flag
        does not have).
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionRequest" }
      responses:
        "200":
          description: The diff
          content: { application/json: { schema: { $ref: "#/components/schemas/PromotionPreview" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "ENVIRONMENT_NOT_FOUND (the target, or the source in this workspace) or FLAG_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags/{key}/promotions:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    post:
      tags: [control-plane]
      summary: Copy the selected parts of a flag's configuration into this environment
      description: >-
        An ordinary edit of the target: the same role (an approver for production),
        validation, version bump, audit entry (`flag.update`, whose "after" also
        records `promotedFrom`) and Redis event. `expectedVersion` (the target's) and
        `sourceVersion` come from the preview and are required: if either side
        changed since, 409 VERSION_CONFLICT / SOURCE_CHANGED and nothing is written.
        409 NOTHING_TO_PROMOTE when the selected parts are already identical; 400
        when the target would refuse the result.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionRequest" }
      responses:
        "200":
          description: The target flag after the change
          content: { application/json: { schema: { $ref: "#/components/schemas/Flag" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: "VERSION_CONFLICT, SOURCE_CHANGED or NOTHING_TO_PROMOTE", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags/{key}/scheduled-changes:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    post:
      tags: [control-plane]
      summary: Schedule a change to this flag in this environment (editor+, and the role of the change)
      description: >-
        Kinds: enable, disable, kill, patch (rollout, fallthroughVariationId and/or
        targetingRules, validated like an edit). `runAt` is an RFC 3339 timestamp
        (stored in UTC), at least 1 minute and at most a year ahead. The role needed
        is the one for making the change now (kill: editor; anything else in
        production: approver), 403 FORBIDDEN otherwise, and it is checked again when
        the change runs, against the creator's membership then. `idempotencyKey`
        (required, per workspace) makes a retry return the existing change (200,
        `Idempotent-Replay: true`); the same key for a different change is 409
        IDEMPOTENCY_CONFLICT. At most 10 pending changes per flag and 100 per
        workspace (409 QUOTA_EXCEEDED). Audited as scheduled_change.create.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduledChangeRequest" }
      responses:
        "200": { description: The same request again (idempotent replay), content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledChange" } } } }
        "201": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: "IDEMPOTENCY_CONFLICT or QUOTA_EXCEEDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/scheduled-changes:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List scheduled changes in this environment (any role)
      description: Waiting ones first (soonest first), then history (newest first); at most 200.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      parameters:
        - { name: flag, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, running, succeeded, failed, missed, cancelled] } }
      responses:
        "200":
          description: Scheduled changes
          content:
            application/json:
              schema:
                type: object
                required: [scheduledChanges]
                properties:
                  scheduledChanges:
                    type: array
                    items: { $ref: "#/components/schemas/ScheduledChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }

  /environments/{envId}/scheduled-changes/{changeId}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [control-plane]
      summary: Read one scheduled change (any role)
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200": { description: The change, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledChange" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "ENVIRONMENT_NOT_FOUND or SCHEDULED_CHANGE_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/scheduled-changes/{changeId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [control-plane]
      summary: Cancel a pending or running scheduled change (its creator, or the role of the change)
      description: >-
        A change is applied completely or not at all: if it is being applied right
        now, the cancel waits for it and is refused (409 NOT_CANCELLABLE) when it
        succeeded. Audited as scheduled_change.cancel.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledChange" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "ENVIRONMENT_NOT_FOUND or SCHEDULED_CHANGE_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: NOT_CANCELLABLE (already finished), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /internal/scheduler/run:
    post:
      tags: [system]
      summary: Run the scheduled changes that are due (internal; for a scheduler job)
      description: >-
        Not part of the public API and not for browsers (no CORS). Enabled only when
        the API has a SCHEDULER_SECRET of at least 32 characters; otherwise it
        answers like any unknown path (404). Send the secret in
        `X-Helios-Scheduler-Secret`; it is compared in constant time. A missing or
        wrong secret, or any request with an Origin header, is one fixed 401 with no
        detail. Rate limited per IP before the secret is checked. Answers with
        counts only. Safe to call concurrently from many instances. See
        docs/SCHEDULING.md.
      security: [{ schedulerSecret: [] }]
      responses:
        "200":
          description: Counts of what this call did
          content:
            application/json:
              schema:
                type: object
                required: [missed, claimed, reclaimed, succeeded, failed, retried, skipped]
                properties:
                  missed: { type: integer }
                  claimed: { type: integer }
                  reclaimed: { type: integer, description: Claimed from a worker whose lease had expired (included in claimed) }
                  succeeded: { type: integer }
                  failed: { type: integer }
                  retried: { type: integer }
                  skipped: { type: integer, description: Claimed, then cancelled or taken over before it ran }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Disabled (no secret configured) }
        "429": { description: RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/api-tokens:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: List the workspace's API tokens (admin or owner; user session only)
      description: >-
        Newest first, with status (active, expired, revoked). Only display data: never the
        secret, never the hash. **Not available to an API token** (403 TOKEN_NOT_ALLOWED): a
        token cannot list, create or revoke tokens.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      tags: [control-plane]
      summary: Create an API token (admin or owner; user session only)
      description: >-
        The plaintext token is in the response **once** and can never be shown again; only its
        SHA-256 hash is stored. The role is `viewer`, `editor` or `admin` and at most the caller's
        own (403 above it; `owner` is not a token role). `environments` (keys or ids of this
        workspace) restricts the token; empty means all. `expiresInDays` is 1-366, default 90: there
        is no way to make a token that never expires. At most 10 active tokens per person and 25 per
        workspace (409 QUOTA_EXCEEDED). Audited as api_token.create (the secret is never recorded).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token, plaintext]
                properties:
                  token: { $ref: "#/components/schemas/ApiToken" }
                  plaintext: { type: string, description: "hlt_<8 hex>_<43 base64url>; shown once", example: hlt_1a2b3c4d_REDACTED }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/api-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Revoke an API token (admin or owner; user session only)
      description: >-
        Any admin or owner may revoke any of the workspace's tokens. The token stops working at once on
        the instance that handled this request and, through the revocation announcement, on every
        other within milliseconds; if the announcement is lost, within the 15-second verification
        cache. Revoking a revoked token is a no-op. Audited as api_token.revoke (critical).
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or TOKEN_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/environments:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: The environments the caller can see (any member, or an API token)
      description: >-
        For an API token limited to some environments, only those: it cannot even learn the names of
        the others.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Environments by key
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items:
                      type: object
                      required: [id, key, name, isProduction]
                      properties:
                        id: { type: string, format: uuid }
                        key: { type: string }
                        name: { type: string }
                        isProduction: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /environments/{envId}/sdk-keys:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: SDK keys of this environment (admin+)
      description: Only display prefixes are returned.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/SdkKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    post:
      tags: [control-plane]
      summary: Create an SDK key (admin+)
      description: >-
        The plaintext key is returned once; only its Argon2id hash is stored. A
        workspace may have at most 10 active SDK keys (409 QUOTA_EXCEEDED).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [key, plaintext]
                properties:
                  key: { $ref: "#/components/schemas/SdkKey" }
                  plaintext: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/sdk-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Revoke an SDK key (admin+)
      description: Idempotent. The key stops working within a minute (verification cache).
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "ENVIRONMENT_NOT_FOUND or KEY_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List flags with their config in this environment (any role)
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Flags, ordered by key
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: array
                    items: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [control-plane]
      summary: Create a flag (editor+)
      description: >-
        The flag is created in every environment, disabled everywhere, so
        creation never changes user-visible behaviour (US-01 AC-1).
        Fallthrough defaults to the first variation.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagCreateRequest" }
      responses:
        "201":
          description: Created; returned with its config in {envId}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { description: "INVALID_REQUEST, or TYPE_MISMATCH when a variation value doesn't match variationType", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "FLAG_KEY_EXISTS (keys are unique per workspace), or QUOTA_EXCEEDED (at most 50 flags per workspace)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    get:
      tags: [control-plane]
      summary: Get one flag's config in this environment (any role)
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: The flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    patch:
      tags: [control-plane]
      summary: Update the flag's config in this environment
      description: >-
        Editor+ in non-production environments; approver+ in production.
        Absent fields are unchanged; targetingRules or rollout set to null are
        cleared. Lowering a rollout revokes access already granted, so the
        console should warn before saving that (US-03 AC-3).
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagConfigUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    delete:
      tags: [control-plane]
      summary: Delete the flag from every environment (admin)
      description: >-
        A flag's definition is shared across environments, so this removes it
        everywhere and therefore requires admin in every environment, not
        just {envId}. Refused with 409 IN_USE while the flag is enabled with
        targeting rules anywhere, unless force=true. Refused with 409
        HAS_RUNNING_EXPERIMENT while any environment has a running experiment
        on the flag, even with force=true; stop the experiment first.
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: "IN_USE, or HAS_RUNNING_EXPERIMENT (not bypassed by force)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags/{key}/kill:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    post:
      tags: [control-plane]
      summary: Emergency kill — disable the flag in this environment (editor+, any environment)
      description: >-
        Allowed for editors even in production: a blocked kill during an
        incident costs more than an unnecessary one (US-06). Idempotent, and
        audited at severity=critical on every call (US-08).
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Flag is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }

  /environments/{envId}/audit-logs:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: Read the audit log for this environment (any role)
      description: >-
        Newest first (id descending), keyset-paginated: pass the previous
        page's nextCursor as `before` to get the next page. Read-only.

        Returns entries recorded against {envId}, plus entries that belong to
        no single environment, marked `scope: global` (the console labels them
        "Workspace-level"). Today that is flag.create (a flag is created in
        every environment at once) and every segment.* action (segments are
        shared by the whole workspace). Each such entry is ONE row: it appears
        once in each environment's log, never twice in one response, and the
        action, resourceType, resourceId and severity filters apply to it like
        to any other row. Environment-specific entries (flag.update, flag.kill)
        appear only in their own environment's log.

        Diffs are returned exactly as recorded. Writers redact API keys
        (api_key.create stores "[REDACTED]"), but flag and member diffs
        contain whatever the user entered, such as variation values,
        targeting-rule values and member emails.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      parameters:
        - name: limit
          in: query
          description: Page size. Values above 200 are clamped to 200.
          schema: { type: integer, minimum: 1, default: 50 }
        - name: before
          in: query
          description: Cursor. Return only entries with id less than this.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: action
          in: query
          description: Exact match, e.g. flag.kill
          schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        - name: resourceType
          in: query
          description: Exact match, e.g. flag or member
          schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        - name: resourceId
          in: query
          description: Exact match, e.g. a flag key or a user id
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: severity
          in: query
          schema: { type: string, enum: [info, critical] }
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: ENVIRONMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # --- Experiments -------------------------------------------------------
  # Data collection: POST /track (SDK-key event ingestion, including the
  # reserved "$exposure" event) and .../event-counts; analysis: .../results.

  /environments/{envId}/experiments:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List experiments in this environment (any role)
      description: Newest first, capped at 200 rows (not paginated yet).
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ExperimentStatus" } }
        - { name: flagKey, in: query, schema: { type: string } }
      responses:
        "200":
          description: Experiments
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [control-plane]
      summary: Create a draft experiment (editor+)
      description: >-
        Creates a draft on one flag in {envId}. It does not affect evaluation
        until started. The flag must have at least 2 variations. Metric
        eventName values starting with "$" are reserved and rejected.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: EXPERIMENT_KEY_EXISTS, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    get:
      tags: [control-plane]
      summary: Get one experiment (any role)
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
    patch:
      tags: [control-plane]
      summary: Choose the experiment's control variation (editor+, session only)
      description: >-
        The control is the variation every other variation is compared with. Allowed until the experiment has any
        exposure; afterwards 409 CONTROL_FROZEN. Choosing the current control is a no-op.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controlVariationId]
              properties:
                controlVariationId: { type: string }
      responses:
        "200": { description: The experiment, content: { application/json: { schema: { $ref: "#/components/schemas/Experiment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: CONTROL_FROZEN, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}/start:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    post:
      tags: [control-plane]
      summary: Start a draft experiment (editor+)
      description: >-
        Requires the flag to be enabled in {envId}. Records the flag's current
        targeting, rollout and fallthrough so later edits can be reported as
        configChangedSinceStart. Editing the flag while the experiment runs is
        not blocked.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: "INVALID_TRANSITION (not a draft), FLAG_DISABLED, or EXPERIMENT_ALREADY_RUNNING (another experiment is running on this flag in {envId})", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}/stop:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    post:
      tags: [control-plane]
      summary: Stop a running experiment (approver+)
      description: Stopped is terminal; run a new experiment to measure again.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: INVALID_TRANSITION (not running), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}/event-counts:
    parameters:
      - { $ref: "#/components/parameters/EnvPath" }
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [control-plane]
      summary: How much data has arrived for an experiment (any role)
      description: >-
        Raw counts so a user can see data arriving: exposures per variation
        (every variation of the flag is listed, zero included) and the number
        of other events. These are not results: no rates, no significance.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [exposures, exposureTotal, events, lastEventAt, eventNames]
                properties:
                  eventNames:
                    type: array
                    description: "Event names (other than $exposure) that exist for the experiment, most frequent first, at most 50: what a results metric can be chosen from"
                    items:
                      type: object
                      required: [name, count, kinds]
                      properties:
                        name: { type: string }
                        count: { type: integer }
                        kinds:
                          type: array
                          description: "Metric kinds the data supports for this event: conversion and count always, value only if some event of this name carries a value"
                          items: { type: string, enum: [conversion, count, value] }
                  exposures:
                    type: array
                    items:
                      type: object
                      required: [variationId, count]
                      properties:
                        variationId: { type: string }
                        count: { type: integer }
                  exposureTotal: { type: integer }
                  events: { type: integer, description: "Events other than $exposure" }
                  lastEventAt: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: ENVIRONMENT_NOT_FOUND or EXPERIMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}/results:
    parameters:
      - { $ref: "#/components/parameters/EnvPath" }
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [control-plane]
      summary: Results of a running or stopped experiment (any role)
      description: >-
        Per-variation numbers and comparisons against the control (the first
        variation of the flag), a sample-ratio check and data-quality warnings,
        computed from the exposures and events `POST /track` collected. No
        winner is declared. Attribution: a subject belongs to the variation in
        their `$exposure` event; only their events at or after that exposure and
        inside the run window (started_at to stopped_at, or now) count; a
        conversion counts a subject once. Below 100 exposures per variation (or
        25 conversions in total for a conversion metric) comparisons are
        `insufficient_data`. A number that cannot be computed is null with a
        reason, never NaN or Infinity. P-values are valid only for a fixed sample
        size; see `peekingNote`. Rate limited per user (429 RATE_LIMITED);
        answers are cached for 5 seconds. Draft experiments answer 409
        EXPERIMENT_NOT_STARTED. See docs/RESULTS.md for every formula.
      security: [{ supabaseJWT: [] }, { apiToken: [] }]
      parameters:
        - name: metrics
          in: query
          required: false
          description: >-
            Up to 3 comma-separated `<eventName>:<kind>` pairs (kind: conversion,
            count, value). Default: the experiment's primary metric. An event
            name the experiment does not define must exist among its events.
          schema: { type: string, example: "purchase:conversion,purchase:value" }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: ENVIRONMENT_NOT_FOUND or EXPERIMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: EXPERIMENT_NOT_STARTED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: RESULTS_TIMEOUT (the query exceeded its 5 s limit), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /track:
    post:
      tags: [data-plane]
      summary: Record up to 100 events (exposures and conversions) for experiments
      description: >-
        Authenticated by SDK key, like /evaluate; the key decides the
        workspace and environment, and nothing in the body can name a tenant
        (unknown fields are rejected). An unreadable, oversized (over 256 KB)
        or over-long (over 100 events) body fails as a whole; anything wrong
        with one event is reported for that event only and the rest is stored.
        Sending the same event id again is safe: it is reported as a duplicate
        and stored once. An `$exposure` (name `$exposure`, with experimentId
        and variationId) is stored at most once per subject and experiment;
        the first one wins. Events for experiments that are not running are
        rejected. Limits per key: batches per second and events per minute;
        429 RATE_LIMITED with Retry-After. Events are kept 90 days.
      security: [{ sdkKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [id, name, subjectKey]
                    properties:
                      id: { type: string, description: "Client-chosen, unique per event; the retry key. 1-128 of letters, digits, _ . : -" }
                      name: { type: string, description: "Metric event name, or $exposure. Other names starting with $ are reserved." }
                      subjectKey: { type: string, maxLength: 256 }
                      value: { type: number, description: Finite }
                      experimentId: { type: string, format: uuid, description: "From the experimentId of an /evaluate result" }
                      variationId: { type: string, description: "Only on $exposure: the variationId that was served" }
                      timestamp: { type: string, format: date-time, description: "When it happened; default now. Not more than 5 minutes ahead or 90 days back." }
                      properties: { type: object, description: "At most 2048 bytes serialized" }
                      exposureToken: { type: string, description: "Only on $exposure: the exposureToken /evaluate returned. Required when the server runs EXPOSURE_VERIFICATION=required" }
      responses:
        "200":
          description: Per-event results, in request order
          content:
            application/json:
              schema:
                type: object
                required: [results, accepted, duplicates, rejected]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [index, status]
                      properties:
                        index: { type: integer }
                        id: { type: string }
                        status: { type: string, enum: [accepted, duplicate, rejected] }
                        code: { type: string, enum: [INVALID_EVENT, EXPERIMENT_NOT_FOUND, EXPERIMENT_NOT_RUNNING, INVALID_VARIATION, EXPOSURE_TOKEN_MISSING, EXPOSURE_TOKEN_INVALID, EXPOSURE_TOKEN_EXPIRED] }
                        message: { type: string }
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  rejected: { type: integer }
        "400": { description: "INVALID_REQUEST (unreadable body) or BATCH_SIZE", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: REQUEST_TOO_LARGE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: RATE_LIMITED; honour Retry-After, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "TRACK_UNAVAILABLE: nothing was stored; retry with the same ids", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /evaluate:
    post:
      tags: [data-plane]
      summary: Evaluate 1-100 flags for a context
      description: >-
        Authenticated by SDK key, not user JWT; the key decides the
        environment. A flag that's missing or disabled comes back with a null
        value and the caller serves its own fallback. Any non-200 (including
        503) also means "serve fallback".
      security: [{ sdkKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, flagKeys]
              properties:
                context: { $ref: "#/components/schemas/EvaluationContext" }
                flagKeys:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
      responses:
        "200":
          description: One result per requested key, in request order
          content:
            application/json:
              schema:
                type: object
                required: [evaluations]
                properties:
                  evaluations:
                    type: array
                    items: { $ref: "#/components/schemas/EvaluationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "EVALUATION_UNAVAILABLE — serve fallbacks", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /sdk/stream:
    get:
      tags: [data-plane]
      summary: Server-Sent Events feed of flag-change notifications
      description: >-
        Authenticated by SDK key, same as /evaluate — the key decides the
        environment. Purely a propagation optimization: if unavailable
        (no broker configured, or it's unreachable), this fails fast with
        503 rather than hanging, and the SDK should fall back to polling
        /evaluate. /evaluate's correctness never depends on this endpoint.
      security: [{ sdkKey: [] }]
      responses:
        "200":
          description: >-
            text/event-stream. Each event is `event: flag_update` with a
            JSON data payload: {action, flagKey, enabled, version}. This
            shape is a change notification, not the full flag state — treat
            it as a cue to re-fetch, not as authoritative data.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: STREAM_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: >-
        An API token ("hlt_<8 hex>_<43 base64url>", 256 bits) in the Authorization: Bearer header, and
        nowhere else (a token in a query string or body is ignored). Usable only on routes marked
        token-accessible (the operations that list `apiToken` in their security); every other
        route answers 403 TOKEN_NOT_ALLOWED. The effective role is the lower of the token's role and
        its creator's current role; a token limited to some environments gets 404 for the others.
        A token that is unknown, expired or revoked always gets the same 401 UNAUTHORIZED.
        See docs/API_TOKENS.md.
    schedulerSecret:
      type: apiKey
      in: header
      name: X-Helios-Scheduler-Secret
    supabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase Auth access token (ES256 or RS256), verified against the
        project's public keys at <SUPABASE_URL>/auth/v1/.well-known/jwks.json.
        HS256 tokens, the anon key, and service_role tokens are rejected.
    sdkKey:
      type: apiKey
      in: header
      name: X-Helios-SDK-Key

  parameters:
    EnvPath:
      name: envId
      in: path
      required: true
      description: >-
        The environment's UUID (from GET /me). Access follows the caller's
        role in the environment's workspace. An environment of a workspace the
        caller doesn't belong to, an unknown one, or anything that isn't a UUID
        answers 404 ENVIRONMENT_NOT_FOUND, never 403.
      schema: { type: string, format: uuid, example: 3f2b6c1e-0000-4000-8000-000000000001 }
    WsPath:
      name: wsId
      in: path
      required: true
      description: >-
        The workspace's UUID. Only honoured for members: anyone else gets 404
        WORKSPACE_NOT_FOUND.
      schema: { type: string, format: uuid }
    SegmentKeyPath:
      name: segKey
      in: path
      required: true
      description: The segment's key, unique within its workspace.
      schema: { type: string, example: beta-testers }
    FlagKeyPath:
      name: key
      in: path
      required: true
      schema: { type: string, example: new-checkout }
    ExperimentKeyPath:
      name: key
      in: path
      required: true
      schema: { type: string, example: checkout-test }

  responses:
    ExperimentNotFound:
      description: EXPERIMENT_NOT_FOUND or ENVIRONMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: INVALID_REQUEST
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: UNAUTHORIZED — missing, invalid, or expired credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: FORBIDDEN — the caller's role in {envId} is too low
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    WorkspaceNotFound:
      description: WORKSPACE_NOT_FOUND (unknown, or the caller isn't a member)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SegmentNotFound:
      description: WORKSPACE_NOT_FOUND (unknown, or the caller isn't a member) or SEGMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    FlagNotFound:
      description: FLAG_NOT_FOUND or ENVIRONMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FLAG_KEY_EXISTS }
        message: { type: string }

    Role:
      type: string
      enum: [viewer, editor, approver, admin]

    WorkspaceRole:
      type: string
      enum: [owner, admin, editor, viewer]
      description: >-
        Applies to every environment of the workspace. Owners and admins can do
        everything flags allow (including production); editors edit outside
        production and can kill anywhere; viewers read. Only owners and admins
        manage members, invites, SDK keys and the workspace name.

    Environment:
      type: object
      required: [id, key, name, isProduction]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$', description: Never UUID-shaped. }
        name: { type: string }
        isProduction: { type: boolean }

    Workspace:
      type: object
      required: [id, name, slug, role, environments]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        environments:
          type: array
          items: { $ref: "#/components/schemas/Environment" }

    NameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    Me:
      type: object
      required: [id, email, activeWorkspaceId, workspaces, invites, ownershipOffers, pendingDeletion]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        activeWorkspaceId: { type: string, format: uuid }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        invites:
          type: array
          description: Open invites addressed to the caller's email. They never carry a token.
          items:
            type: object
            required: [id, workspaceId, workspaceName, role, invitedByEmail, expiresAt]
            properties:
              id: { type: string, format: uuid }
              workspaceId: { type: string, format: uuid }
              workspaceName: { type: string }
              role: { $ref: "#/components/schemas/WorkspaceRole" }
              invitedByEmail: { type: string }
              expiresAt: { type: string, format: date-time }
        ownershipOffers:
          type: array
          description: Offers of ownership addressed to the caller (an admin of that workspace)
          items: { $ref: "#/components/schemas/OwnershipOffer" }
        pendingDeletion:
          type: array
          description: Workspaces the caller OWNS that are scheduled for deletion and can still be restored (nobody else sees them)
          items: { $ref: "#/components/schemas/PendingDeletion" }

    FlagHistoryEntry:
      type: object
      required: [id, createdAt, action, summary, severity, actor, changes]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        action: { type: string }
        summary: { type: string }
        severity: { type: string }
        source: { type: string, description: "e.g. 'promotion from staging' or 'scheduled change'" }
        actor:
          type: object
          required: [type, label]
          properties:
            type: { type: string, enum: [user, api_token, schedule] }
            label: { type: string }
            onBehalfOf: { type: string, description: "The person who made the token, or who scheduled the change" }
        changes:
          type: array
          items:
            type: object
            required: [field, label, before, after]
            properties:
              field: { type: string }
              label: { type: string }
              before: { type: array, items: { type: string } }
              after: { type: array, items: { type: string } }

    OwnershipOffer:
      type: object
      required: [id, workspaceId, workspaceName, fromEmail, toUserId, toEmail, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        fromEmail: { type: string }
        toUserId: { type: string, format: uuid }
        toEmail: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    PendingDeletion:
      type: object
      required: [id, name, deletedAt, purgeAfter]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        deletedAt: { type: string, format: date-time }
        purgeAfter: { type: string, format: date-time, description: Restorable until this time; the data is deleted for good after it }

    Member:
      type: object
      required: [userId, email, role, joinedAt, isYou]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }
        isYou: { type: boolean }

    Invite:
      type: object
      required: [id, email, role, invitedByEmail, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        invitedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        emailStatus: { type: string, enum: [none, queued, sent, failed], description: "The latest invite email. none: no email was queued (an invite from before email existed)." }
        emailError: { type: string, description: "Short, fixed-vocabulary reason when failed" }
        emailUpdatedAt: { type: [string, "null"], format: date-time }

    SdkKey:
      type: object
      required: [id, name, kind, prefix, createdAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [sdk] }
        prefix: { type: string, example: hsdk_1a2b3c4d }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }

    Variation:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { description: "Must match the flag's variationType; at most 4 KB" }

    FlagCreateRequest:
      type: object
      required: [key, name, variationType, variations]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" }
        name: { type: string }
        description: { type: string }
        variationType:
          type: string
          enum: [boolean, string, number, json]
        variations:
          type: array
          minItems: 2
          maxItems: 20
          description: Order matters — it defines rollout bucket ranges.
          items: { $ref: "#/components/schemas/Variation" }

    Clause:
      type: object
      required: [operator]
      description: >-
        One test on a context attribute (or, for inSegment / notInSegment, on
        the subject). A missing or null context attribute makes every operator
        false (US-02 AC-2). So does a value of the wrong type for the operator
        (a number where text is needed, an invalid version or date, a regex
        input over 2,048 bytes) — never an error, and also when `negate` is
        set: negation inverts the answer only where the operator could be
        evaluated.
      properties:
        attribute:
          type: string
          description: Required for every operator except inSegment and notInSegment, which must leave it empty.
        operator:
          type: string
          enum:
            - equals
            - in
            - contains
            - greaterThan
            - exists
            - startsWith
            - endsWith
            - lessThan
            - lessThanOrEqual
            - greaterThanOrEqual
            - semverEquals
            - semverLessThan
            - semverLessThanOrEqual
            - semverGreaterThan
            - semverGreaterThanOrEqual
            - dateBefore
            - dateAfter
            - dateEquals
            - matchesRegex
            - inSegment
            - notInSegment
        value:
          description: >-
            equals/contains: string, number or boolean. in: non-empty array.
            greaterThan, greaterThanOrEqual, lessThan, lessThanOrEqual: number.
            startsWith/endsWith: non-empty string (case-sensitive).
            semver*: a valid semantic version (MAJOR.MINOR.PATCH, optional
            -prerelease and +build; no "v" prefix); build metadata is ignored.
            date*: an RFC 3339 timestamp such as 2024-05-01T00:00:00Z.
            matchesRegex: a Go (RE2) regular expression of at most 256 bytes,
            matched anywhere in the value unless anchored; linear time, never
            backtracking, and invalid patterns are rejected on save.
            inSegment/notInSegment: the key of an existing segment (a saved
            rule cannot name one that does not exist; if it is deleted later,
            the clause matches nobody, under either operator). Ignored for exists.
        negate:
          type: boolean
          description: >-
            Invert the operator. Not allowed with exists (a missing attribute
            never matches) or the segment operators (use the opposite operator).

    PromotionRequest:
      type: object
      additionalProperties: false
      required: [sourceEnvironment]
      properties:
        sourceEnvironment: { type: string, description: "Key (staging) or id of an environment of the same workspace" }
        parts:
          type: array
          description: Default [rules, rollout, fallthrough]; the enabled state is only copied when listed
          items: { type: string, enum: [rules, rollout, fallthrough, enabled] }
        expectedVersion: { type: integer, format: int64, description: "Apply only: the target's version from the preview" }
        sourceVersion: { type: integer, format: int64, description: "Apply only: the source's version from the preview" }

    PromotionPreview:
      type: object
      required: [flagKey, source, target, parts, defaultParts, problems, nothingToApply, canApply, expectedVersion, sourceVersion]
      properties:
        flagKey: { type: string }
        source: { $ref: "#/components/schemas/PromotionSide" }
        target: { $ref: "#/components/schemas/PromotionSide" }
        parts:
          type: array
          items:
            type: object
            required: [part, selected, changed, source, target]
            properties:
              part: { type: string, enum: [rules, rollout, fallthrough, enabled] }
              selected: { type: boolean }
              changed: { type: boolean }
              source: { description: The part in the source environment }
              target: { description: The part in the target environment }
        defaultParts: { type: array, items: { type: string } }
        problems: { type: array, items: { type: string }, description: Why the selected parts cannot be applied }
        nothingToApply: { type: boolean }
        canApply: { type: boolean }
        expectedVersion: { type: integer, format: int64 }
        sourceVersion: { type: integer, format: int64 }

    PromotionSide:
      type: object
      required: [environment, version, enabled]
      properties:
        environment: { type: string }
        version: { type: integer, format: int64 }
        enabled: { type: boolean }

    ScheduledChangeRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, kind, runAt]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [enable, disable, kill, patch] }
        runAt: { type: string, format: date-time, description: At least 1 minute and at most 366 days ahead }
        change:
          type: object
          description: For a patch only. At least one of the three.
          additionalProperties: false
          properties:
            rollout: { type: [object, "null"] }
            fallthroughVariationId: { type: string }
            targetingRules: { type: [array, "null"], items: { $ref: "#/components/schemas/TargetingRule" } }

    ScheduledChange:
      type: object
      required: [id, flagKey, environment, kind, change, runAt, status, idempotencyKey, baseVersion, attempts, resultCode, resultMessage, createdBy, createdAt, updatedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        flagKey: { type: string }
        environment: { type: string }
        kind: { type: string, enum: [enable, disable, kill, patch] }
        change: { type: object }
        runAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, running, succeeded, failed, missed, cancelled] }
        idempotencyKey: { type: string }
        baseVersion: { type: integer, format: int64, description: The flag configuration's version when scheduled }
        attempts: { type: integer }
        resultCode:
          type: [string, "null"]
          description: APPLIED, CANCELLED, MISSED, RETRYING, RETRIES_EXHAUSTED, CREATOR_REMOVED, CREATOR_NOT_AUTHORIZED, CONFLICT, INVALID_CHANGE or FLAG_NOT_FOUND
        resultMessage: { type: [string, "null"] }
        createdBy: { type: string, description: The creator's email }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    ApiTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        role: { type: string, enum: [viewer, editor, admin], description: At most the caller's own role. Fixed for the life of the token. }
        environments: { type: array, maxItems: 20, items: { type: string }, description: "Keys or ids of this workspace's environments; empty or absent: all" }
        expiresInDays: { type: integer, minimum: 1, maximum: 366, default: 90 }

    WebhookEventType:
      type: string
      enum: [flag.created, flag.updated, flag.killed, flag.deleted, experiment.started, experiment.stopped, promotion.applied, scheduled_change.executed, scheduled_change.failed]

    WebhookEndpoint:
      type: object
      required: [id, url, description, eventTypes, environment, enabled, secretHint, previousSecretExpiresAt, health, createdAt, status]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        eventTypes: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        environment: { type: [object, "null"], properties: { id: { type: string }, key: { type: string } }, description: "null: every environment" }
        enabled: { type: boolean }
        secretHint: { type: string, description: "The last four characters of the signing secret" }
        previousSecretExpiresAt: { type: [string, "null"], format: date-time, description: "While set, deliveries carry two signatures" }
        health:
          type: object
          properties:
            consecutiveFailures: { type: integer }
            failingSince: { type: [string, "null"], format: date-time }
            lastSuccessAt: { type: [string, "null"], format: date-time }
            lastFailureAt: { type: [string, "null"], format: date-time }
            disabledReason: { type: [string, "null"] }
            disabledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [healthy, failing, disabled, idle] }

    WebhookDelivery:
      type: object
      required: [id, eventId, eventType, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid, description: "The delivery id the receiver sees in Helios-Delivery-Id; stable across attempts" }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivering, delivered, failed, dead] }
        attempts: { type: integer }
        httpStatus: { type: [integer, "null"] }
        durationMs: { type: [integer, "null"] }
        error: { type: [string, "null"], description: "A short fixed-vocabulary description; never a secret or the receiver's body" }
        responseHint: { type: [string, "null"], description: "A truncated, printable start of the receiver's response to a failed attempt" }
        createdAt: { type: string, format: date-time }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        nextAttemptAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }

    ApiToken:
      type: object
      required: [id, name, prefix, role, environments, expiresAt, lastUsedAt, createdAt, createdBy, revokedAt, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: '"hlt_" and 8 hex characters: identifies the token in lists and audit entries; not secret', example: hlt_1a2b3c4d }
        role: { type: string, enum: [viewer, editor, admin] }
        environments:
          type: array
          description: Empty means every environment of the workspace
          items: { type: object, required: [id, key], properties: { id: { type: string, format: uuid }, key: { type: string } } }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time, description: Written at most once a minute; null until first used }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: The creator's email }
        revokedAt: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, expired, revoked] }

    SegmentRules:
      type: array
      maxItems: 20
      description: >-
        ANDed. Same clauses as a flag rule, except inSegment and notInSegment
        (segments cannot reference segments). At most 20 clauses and 8,192 bytes.
      items: { $ref: "#/components/schemas/Clause" }

    SegmentSummary:
      type: object
      required: [key, name, description, rules, memberCount, version, createdAt, updatedAt]
      properties:
        key: { type: string }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        rules: { $ref: "#/components/schemas/SegmentRules" }
        memberCount: { type: integer, maximum: 10000 }
        version: { type: integer, format: int64, description: Raised on every change }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Segment:
      allOf:
        - $ref: "#/components/schemas/SegmentSummary"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              description: Explicit member subject keys, sorted
              items: { type: string, minLength: 1, maxLength: 256 }

    SegmentCreateRequest:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        rules: { $ref: "#/components/schemas/SegmentRules" }
        members: { type: array, maxItems: 10000, items: { type: string, minLength: 1, maxLength: 256 } }

    SegmentUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        rules: { type: [array, "null"], description: "null or [] removes the rules", items: { $ref: "#/components/schemas/Clause" } }
        members: { type: array, maxItems: 10000, description: Replaces the whole member list, items: { type: string, minLength: 1, maxLength: 256 } }
        expectedVersion: { type: integer, format: int64 }

    SegmentUsage:
      type: object
      required: [segmentKey, flags]
      properties:
        segmentKey: { type: string }
        flags:
          type: array
          items:
            type: object
            required: [flagKey, flagName, environments]
            properties:
              flagKey: { type: string }
              flagName: { type: string }
              environments:
                type: array
                items:
                  type: object
                  required: [key, enabled]
                  properties:
                    key: { type: string }
                    enabled: { type: boolean }

    TargetingRule:
      type: object
      required: [clauses, variationId]
      description: All clauses must match. Rules evaluate top-down; first match wins.
      properties:
        clauses:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Clause" }
        variationId: { type: string }

    FlagConfigUpdateRequest:
      type: object
      minProperties: 1
      properties:
        enabled: { type: boolean }
        targetingRules:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TargetingRule" }
        rollout:
          type: [object, "null"]
          description: variationId -> integer basis points, summing to exactly 100000
          additionalProperties: { type: integer, minimum: 0 }
        fallthroughVariationId: { type: string }

    ExperimentStatus:
      type: string
      enum: [draft, running, stopped]

    ExperimentMetric:
      type: object
      required: [name, eventName, type, isPrimary]
      properties:
        name: { type: string, maxLength: 128 }
        eventName:
          type: string
          description: Must not start with "$" (reserved for Helios events such as $exposure).
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
        type:
          type: string
          description: conversion counts once per subject; value records every event with a numeric value.
          enum: [conversion, value]
        isPrimary: { type: boolean }

    ExperimentCreateRequest:
      type: object
      required: [flagKey, key, name, metrics]
      properties:
        controlVariationId: { type: string, description: "The control: one of the flag's variations. Omitted: the flag's first variation. Fixed once the experiment has an exposure." }
        flagKey: { type: string }
        key: { type: string, description: Same rules as a flag key, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' }
        name: { type: string, maxLength: 200 }
        hypothesis: { type: string, maxLength: 2000 }
        metrics:
          type: array
          minItems: 1
          maxItems: 10
          description: Exactly one must be primary; names and eventNames must be unique.
          items: { $ref: "#/components/schemas/ExperimentMetric" }

    Experiment:
      type: object
      required: [id, key, name, hypothesis, flagKey, environment, status, startedAt, stoppedAt, metrics, configChangedSinceStart, createdAt, controlVariationId, variations]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        hypothesis: { type: string }
        flagKey: { type: string }
        environment: { type: string }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        startedAt: { type: [string, "null"], format: date-time }
        stoppedAt: { type: [string, "null"], format: date-time }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ExperimentMetric" }
        configChangedSinceStart:
          type: boolean
          description: >-
            The flag's targeting, rollout or fallthrough in this environment
            differs from when the experiment started (or, once stopped, from
            when it stopped). Informational; flag edits are not blocked.
        createdAt: { type: string, format: date-time }
        controlVariationId: { type: string, description: The variation every other variation is compared with (exactly one per experiment) }
        variations:
          type: array
          description: The flag's variations in its order, the control marked
          items: { type: object, required: [id, isControl], properties: { id: { type: string }, isControl: { type: boolean } } }

    Flag:
      type: object
      description: A flag's definition plus its config in one environment.
      required: [key, name, description, variationType, variations, environment, config, createdAt, updatedAt]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        variationType: { type: string, enum: [boolean, string, number, json] }
        variations:
          type: array
          items: { $ref: "#/components/schemas/Variation" }
        environment: { type: string }
        config:
          type: object
          required: [enabled, targetingRules, rollout, fallthroughVariationId, version, updatedAt]
          properties:
            enabled: { type: boolean }
            targetingRules:
              type: array
              items: { $ref: "#/components/schemas/TargetingRule" }
            rollout:
              type: [object, "null"]
              additionalProperties: { type: integer }
            fallthroughVariationId: { type: string }
            version: { type: integer, description: Bumped on every change }
            updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      required: [id, createdAt, actorEmail, action, resourceType, resourceId, severity, diffBefore, diffAfter, scope]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        actorEmail: { type: string }
        action: { type: string, example: flag.kill }
        resourceType: { type: string, example: flag }
        resourceId: { type: string, example: ui-test-flag }
        severity: { type: string, enum: [info, critical] }
        diffBefore: { description: State before the change; null when the resource did not exist }
        diffAfter: { description: State after the change; null when the resource no longer exists }
        scope:
          type: string
          enum: [environment, global]
          description: >-
            global = a workspace-level change, not tied to one environment
            (flag.create, segment.*); one entry, listed once in every environment's log.

    AuditLogList:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        nextCursor:
          type: [integer, "null"]
          format: int64
          description: Pass as `before` for the next page; null when there are no more entries.

    EvaluationContext:
      type: object
      required: [subjectKey]
      properties:
        subjectKey: { type: string }
        attributes:
          type: object
          additionalProperties: true

    ExperimentResults:
      type: object
      required: [experimentKey, flagKey, status, readAt, window, control, sampleSize, trustworthy, srm, metrics, warnings, alpha, comparisonCount, alphaPerComparison, confidenceLevel, thresholds, peekingNoteCode, peekingNote, method]
      properties:
        experimentKey: { type: string }
        flagKey: { type: string }
        status: { type: string, enum: [running, stopped] }
        readAt: { type: string, format: date-time }
        window:
          type: object
          required: [start, end, stoppedAt, running, hours]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time, description: "stoppedAt, or readAt while running" }
            stoppedAt: { type: [string, "null"], format: date-time }
            running: { type: boolean }
            hours: { type: number }
        control: { type: string, description: "The variation everything is compared with: the first variation of the flag" }
        sampleSize: { type: integer, description: "Total exposures at this reading" }
        trustworthy: { type: boolean, description: "false when the sample-ratio check failed" }
        srm:
          type: object
          required: [observed, expected, expectedSource, confidence, threshold, detected, degreesOfFreedom]
          properties:
            observed: { type: array, items: { type: object, properties: { variationId: { type: string }, count: { type: integer } } } }
            expected: { type: array, items: { type: object, properties: { variationId: { type: string }, share: { type: number } } } }
            expectedSource: { type: string, enum: [rollout_at_start, equal_assumed] }
            confidence: { type: string, enum: [high, low] }
            confidenceReason: { type: string }
            chiSquare: { type: [number, "null"] }
            degreesOfFreedom: { type: integer }
            pValue: { type: [number, "null"] }
            threshold: { type: number }
            detected: { type: boolean }
            reason: { type: string, description: "Why the check could not run" }
        metrics:
          type: array
          items:
            type: object
            required: [metric, status, variations, comparisons]
            properties:
              status:
                type: string
                enum: [ok, insufficient_data, unavailable]
                description: "The metric as a whole: insufficient_data when any comparison is below the data minimum, unavailable when nothing can be compared, else ok. Show a message about it once, not per comparison"
              statusReasons:
                type: array
                items: { type: string }
                description: "Distinct reason codes behind a status other than ok (EXPOSURES_BELOW_100, CONVERSIONS_BELOW_25, SINGLE_VARIATION, ...)"
              metric:
                type: object
                required: [eventName, kind, isPrimary]
                properties:
                  name: { type: string }
                  eventName: { type: string }
                  kind: { type: string, enum: [conversion, count, value] }
                  isPrimary: { type: boolean }
              variations:
                type: array
                items:
                  type: object
                  properties:
                    variationId: { type: string }
                    isControl: { type: boolean }
                    exposures: { type: integer }
                    convertingSubjects: { type: integer }
                    events: { type: integer }
                    rate: { type: [number, "null"], description: "conversion metrics" }
                    mean: { type: [number, "null"], description: "count and value metrics" }
                    stdDev: { type: [number, "null"] }
                    trustworthy: { type: boolean }
              comparisons:
                type: array
                items:
                  type: object
                  properties:
                    variationId: { type: string }
                    against: { type: string }
                    status: { type: string, enum: [significant, not_significant, insufficient_data, invalid] }
                    statusReasons: { type: array, items: { type: string } }
                    difference: { type: [number, "null"] }
                    differenceInterval: { type: object, properties: { low: { type: [number, "null"] }, high: { type: [number, "null"] } } }
                    relativeLift: { type: [number, "null"] }
                    relativeLiftInterval: { type: object, properties: { low: { type: [number, "null"] }, high: { type: [number, "null"] } } }
                    statistic: { type: [number, "null"], description: "z (conversion) or t (count, value)" }
                    degreesOfFreedom: { type: [number, "null"] }
                    pValue: { type: [number, "null"], description: "two-sided, unadjusted" }
                    adjustedPValue: { type: [number, "null"], description: "Bonferroni: pValue times the number of comparisons, at most 1" }
                    alphaPerComparison: { type: number, deprecated: true, description: "Deprecated: the same for every comparison; use the top-level alphaPerComparison" }
                    confidenceLevel: { type: number, deprecated: true, description: "Deprecated: the same for every comparison; use the top-level confidenceLevel" }
                    reasons: { type: object, additionalProperties: { type: string }, description: "Why a null field is null" }
                    trustworthy: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [code, severity, message]
            properties:
              code: { type: string, enum: [NO_EXPOSURES, SRM_FAILED, SRM_LOW_CONFIDENCE, INSUFFICIENT_DATA, EXPOSURES_UNVERIFIED, CLIENT_CLOCK_ADJUSTED, EVENTS_WITHOUT_EXPOSURE, EVENTS_BEFORE_EXPOSURE, EVENTS_OUTSIDE_WINDOW, FLAG_CONFIG_CHANGED, EXPERIMENT_RESTARTED, SHORT_RUN, SINGLE_VARIATION] }
              severity: { type: string, enum: [info, warning, critical] }
              message: { type: string, description: "An English convenience sentence built from detail. Do not parse it; it can change" }
              detail: { type: object, description: "The contract: structured facts for this code (counts, dates, ids, reason codes), always present", additionalProperties: true }
        alpha: { type: number, description: "Family-wise level; each comparison is tested at alpha divided by the number of comparisons" }
        comparisonCount: { type: integer, description: "m: the variations other than the control (0 with a single variation)" }
        alphaPerComparison: { type: number, description: "alpha / comparisonCount (alpha when there is no comparison)" }
        confidenceLevel: { type: number, description: "1 - alphaPerComparison: the level of every interval in this response (0.95 with one comparison, wider with more). Use this instead of the per-comparison field" }
        thresholds:
          type: object
          properties:
            minExposuresPerVariation: { type: integer }
            minConversionsTotal: { type: integer }
            srmPValue: { type: number }
        peekingNoteCode: { type: string, enum: [FIXED_SAMPLE_SIZE], description: "Stable code of the caveat that p-values are only valid for a fixed sample size; a client can show its own translation" }
        peekingNote: { type: string, description: "The default English text of peekingNoteCode" }
        method: { type: array, items: { type: string }, description: "Plain-language description of how the numbers were computed" }

    EvaluationResult:
      type: object
      required: [flagKey, variationId, value, reason, experimentId]
      properties:
        flagKey: { type: string }
        variationId: { type: [string, "null"] }
        value: { description: "null when no variation applies — serve your fallback" }
        reason:
          type: string
          enum: [TARGETING_MATCH, ROLLOUT, FALLTHROUGH, FLAG_DISABLED, FLAG_NOT_FOUND, TYPE_MISMATCH]
        experimentId:
          type: [string, "null"]
          description: >-
            The flag's RUNNING experiment in this environment, when a variation
            was served; otherwise null. Report an $exposure for it via /track.
            The variation is the flag's own: an experiment does not re-bucket.
        exposureToken:
          type: string
          description: >-
            Present only together with experimentId. A short signed proof that
            the server served this variation of this experiment to this subject;
            pass it back unchanged as `exposureToken` on the $exposure event.
            Bound to the workspace, environment, experiment, variation and subject,
            and valid for about 24 hours. See docs/SDK_TRACKING.md.
