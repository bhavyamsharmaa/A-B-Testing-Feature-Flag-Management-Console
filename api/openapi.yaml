openapi: 3.1.0
info:
  title: Helios API
  version: 0.1.0
  description: >-
    Shared contract for the Helios control plane (flag / segment / experiment
    CRUD, RBAC, audit) and data plane (flag evaluation). This file is the source
    of truth for the API shape: backend handlers under /backend and the frontend
    API client under /frontend are both expected to conform to it.
servers:
  - url: https://TODO-your-render-service.onrender.com
    description: Production (Render)
  - url: http://localhost:8080
    description: Local development (Go backend)

tags:
  - name: system
  - name: control-plane
  - name: data-plane

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

components:
  schemas: {}
