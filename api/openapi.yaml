openapi: 3.1.0
info:
  title: Helios API
  version: 0.3.0
  description: >-
    Shared contract for the Helios control plane (flag CRUD, RBAC, audit) and
    data plane (flag evaluation). This file is the source of truth for the API
    shape: backend handlers under /backend and the frontend API client under
    /frontend are both expected to conform to it.

    Control-plane routes take a Supabase Auth access token. Data belongs to a
    workspace; a user can belong to several, with a role in each (owner > admin
    > editor > viewer). Routes with {envId} or {wsId} resolve it through the
    caller's own membership: anything the caller is not a member of answers 404,
    never 403, so ids can't be probed. Every non-2xx JSON response has the
    Error shape.
servers:
  - url: https://TODO-your-render-service.onrender.com
    description: Production (Render)
  - url: http://localhost:8080
    description: Local development (Go backend)

tags:
  - name: system
  - name: control-plane
  - name: data-plane

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe — 200 only if the database is reachable
      security: []
      responses:
        "200":
          description: Service is up and the database answered a ping
          content:
            text/plain:
              schema: { type: string, example: ok }
        "503":
          description: Database unreachable
          content:
            text/plain:
              schema: { type: string, example: db unreachable }

  /me:
    get:
      tags: [control-plane]
      summary: The current user, their workspaces and open invites
      description: >-
        The first call for a user creates their personal workspace (dev,
        staging and production environments, the user as owner). The first
        workspace listed is the active one (most recently used).
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workspaces:
    get:
      tags: [control-plane]
      summary: The caller's workspaces (same data as in /me)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Workspaces, most recently used first
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [control-plane]
      summary: Create a workspace owned by the caller, and switch to it
      description: >-
        Created with dev, staging and production environments. A user owns at
        most 5 workspaces (409 QUOTA_EXCEEDED beyond that).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    patch:
      tags: [control-plane]
      summary: Rename the workspace (admin+)
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/{wsId}/switch:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    post:
      tags: [control-plane]
      summary: Make this the caller's active workspace (any member)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Active workspace updated
          content:
            application/json:
              schema:
                type: object
                required: [activeWorkspaceId]
                properties:
                  activeWorkspaceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/{wsId}/members:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: List the workspace's members (any member)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Members, owners first
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /workspaces/{wsId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [control-plane]
      summary: Change a member's role (admin+)
      description: >-
        Owners can set any role, including owner (hand-over). Admins manage
        everyone except owners and can't create owners. The last owner can't
        be demoted (409 LAST_OWNER).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "200": { description: Role changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or MEMBER_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: LAST_OWNER, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [control-plane]
      summary: Remove a member, or leave the workspace (own id)
      description: >-
        Any member may remove themselves. Removing someone else needs admin,
        and an owner can only be removed by an owner. The last owner can't
        leave or be removed (409 LAST_OWNER).
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or MEMBER_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: LAST_OWNER, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/invites:
    parameters: [{ $ref: "#/components/parameters/WsPath" }]
    get:
      tags: [control-plane]
      summary: Open invites of the workspace (admin+)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Unexpired, unrevoked, unaccepted invites
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      tags: [control-plane]
      summary: Invite someone by email (admin+)
      description: >-
        Helios does not send email: the response carries a one-time token (only
        its hash is stored; it can't be shown again) for the inviter to turn
        into a link. It is valid for 7 days and only for that address. Members
        plus open invites are capped at 20 (409 QUOTA_EXCEEDED). Invites are
        never for the owner role.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { type: string, enum: [admin, editor, viewer] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  token: { type: string, description: "hinv_… shown once" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { description: "ALREADY_MEMBER, INVITE_EXISTS or QUOTA_EXCEEDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /workspaces/{wsId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WsPath"
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Revoke an open invite (admin+)
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "WORKSPACE_NOT_FOUND or INVITE_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /invites/accept:
    post:
      tags: [control-plane]
      summary: Accept an invite and join its workspace
      description: >-
        Name the invite by its one-time token, or by the id listed in GET /me
        (invites addressed to the caller's email). The caller's email must be
        the invited address (403 otherwise). The token works once.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of token or inviteId.
              properties:
                token: { type: string }
                inviteId: { type: string, format: uuid }
      responses:
        "200":
          description: Joined; the workspace becomes the active one
          content:
            application/json:
              schema:
                type: object
                required: [workspaceId]
                properties:
                  workspaceId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: INVITE_NOT_FOUND (invalid, used or revoked), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: INVITE_EXPIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/sdk-keys:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: SDK keys of this environment (admin+)
      description: Only display prefixes are returned.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/SdkKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    post:
      tags: [control-plane]
      summary: Create an SDK key (admin+)
      description: >-
        The plaintext key is returned once; only its Argon2id hash is stored. A
        workspace may have at most 10 active SDK keys (409 QUOTA_EXCEEDED).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [key, plaintext]
                properties:
                  key: { $ref: "#/components/schemas/SdkKey" }
                  plaintext: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/sdk-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Revoke an SDK key (admin+)
      description: Idempotent. The key stops working within a minute (verification cache).
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "ENVIRONMENT_NOT_FOUND or KEY_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List flags with their config in this environment (any role)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Flags, ordered by key
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: array
                    items: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [control-plane]
      summary: Create a flag (editor+)
      description: >-
        The flag is created in every environment, disabled everywhere, so
        creation never changes user-visible behaviour (US-01 AC-1).
        Fallthrough defaults to the first variation.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagCreateRequest" }
      responses:
        "201":
          description: Created; returned with its config in {envId}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { description: "INVALID_REQUEST, or TYPE_MISMATCH when a variation value doesn't match variationType", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "FLAG_KEY_EXISTS (keys are unique per workspace), or QUOTA_EXCEEDED (at most 50 flags per workspace)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    get:
      tags: [control-plane]
      summary: Get one flag's config in this environment (any role)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: The flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    patch:
      tags: [control-plane]
      summary: Update the flag's config in this environment
      description: >-
        Editor+ in non-production environments; approver+ in production.
        Absent fields are unchanged; targetingRules or rollout set to null are
        cleared. Lowering a rollout revokes access already granted, so the
        console should warn before saving that (US-03 AC-3).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagConfigUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    delete:
      tags: [control-plane]
      summary: Delete the flag from every environment (admin)
      description: >-
        A flag's definition is shared across environments, so this removes it
        everywhere and therefore requires admin in every environment, not
        just {envId}. Refused with 409 IN_USE while the flag is enabled with
        targeting rules anywhere, unless force=true. Refused with 409
        HAS_RUNNING_EXPERIMENT while any environment has a running experiment
        on the flag, even with force=true; stop the experiment first.
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: "IN_USE, or HAS_RUNNING_EXPERIMENT (not bypassed by force)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/flags/{key}/kill:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    post:
      tags: [control-plane]
      summary: Emergency kill — disable the flag in this environment (editor+, any environment)
      description: >-
        Allowed for editors even in production: a blocked kill during an
        incident costs more than an unnecessary one (US-06). Idempotent, and
        audited at severity=critical on every call (US-08).
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Flag is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }

  /environments/{envId}/audit-logs:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: Read the audit log for this environment (any role)
      description: >-
        Newest first (id descending), keyset-paginated: pass the previous
        page's nextCursor as `before` to get the next page. Read-only.

        Returns entries recorded against {envId}, plus entries that belong to
        no single environment, marked `scope: global`. Today that is
        flag.create, because a flag is created in every environment at once,
        so those entries appear in every environment's log.

        Diffs are returned exactly as recorded. Writers redact API keys
        (api_key.create stores "[REDACTED]"), but flag and member diffs
        contain whatever the user entered, such as variation values,
        targeting-rule values and member emails.
      security: [{ supabaseJWT: [] }]
      parameters:
        - name: limit
          in: query
          description: Page size. Values above 200 are clamped to 200.
          schema: { type: integer, minimum: 1, default: 50 }
        - name: before
          in: query
          description: Cursor. Return only entries with id less than this.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: action
          in: query
          description: Exact match, e.g. flag.kill
          schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        - name: resourceType
          in: query
          description: Exact match, e.g. flag or member
          schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        - name: resourceId
          in: query
          description: Exact match, e.g. a flag key or a user id
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: severity
          in: query
          schema: { type: string, enum: [info, critical] }
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: ENVIRONMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # --- Experiments -------------------------------------------------------
  # Planned, not yet paths: POST /track (SDK-key authenticated event
  # ingestion, including the reserved "$exposure" event) and
  # GET /environments/{envId}/experiments/{key}/results.

  /environments/{envId}/experiments:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List experiments in this environment (any role)
      description: Newest first, capped at 200 rows (not paginated yet).
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ExperimentStatus" } }
        - { name: flagKey, in: query, schema: { type: string } }
      responses:
        "200":
          description: Experiments
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [control-plane]
      summary: Create a draft experiment (editor+)
      description: >-
        Creates a draft on one flag in {envId}. It does not affect evaluation
        until started. The flag must have at least 2 variations. Metric
        eventName values starting with "$" are reserved and rejected.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: EXPERIMENT_KEY_EXISTS, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    get:
      tags: [control-plane]
      summary: Get one experiment (any role)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }

  /environments/{envId}/experiments/{key}/start:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    post:
      tags: [control-plane]
      summary: Start a draft experiment (editor+)
      description: >-
        Requires the flag to be enabled in {envId}. Records the flag's current
        targeting, rollout and fallthrough so later edits can be reported as
        configChangedSinceStart. Editing the flag while the experiment runs is
        not blocked.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: "INVALID_TRANSITION (not a draft), FLAG_DISABLED, or EXPERIMENT_ALREADY_RUNNING (another experiment is running on this flag in {envId})", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{envId}/experiments/{key}/stop:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    post:
      tags: [control-plane]
      summary: Stop a running experiment (approver+)
      description: Stopped is terminal; run a new experiment to measure again.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: INVALID_TRANSITION (not running), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /evaluate:
    post:
      tags: [data-plane]
      summary: Evaluate 1-100 flags for a context
      description: >-
        Authenticated by SDK key, not user JWT; the key decides the
        environment. A flag that's missing or disabled comes back with a null
        value and the caller serves its own fallback. Any non-200 (including
        503) also means "serve fallback".
      security: [{ sdkKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, flagKeys]
              properties:
                context: { $ref: "#/components/schemas/EvaluationContext" }
                flagKeys:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
      responses:
        "200":
          description: One result per requested key, in request order
          content:
            application/json:
              schema:
                type: object
                required: [evaluations]
                properties:
                  evaluations:
                    type: array
                    items: { $ref: "#/components/schemas/EvaluationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "EVALUATION_UNAVAILABLE — serve fallbacks", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /sdk/stream:
    get:
      tags: [data-plane]
      summary: Server-Sent Events feed of flag-change notifications
      description: >-
        Authenticated by SDK key, same as /evaluate — the key decides the
        environment. Purely a propagation optimization: if unavailable
        (no broker configured, or it's unreachable), this fails fast with
        503 rather than hanging, and the SDK should fall back to polling
        /evaluate. /evaluate's correctness never depends on this endpoint.
      security: [{ sdkKey: [] }]
      responses:
        "200":
          description: >-
            text/event-stream. Each event is `event: flag_update` with a
            JSON data payload: {action, flagKey, enabled, version}. This
            shape is a change notification, not the full flag state — treat
            it as a cue to re-fetch, not as authoritative data.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: STREAM_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    supabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase Auth access token (ES256 or RS256), verified against the
        project's public keys at <SUPABASE_URL>/auth/v1/.well-known/jwks.json.
        HS256 tokens, the anon key, and service_role tokens are rejected.
    sdkKey:
      type: apiKey
      in: header
      name: X-Helios-SDK-Key

  parameters:
    EnvPath:
      name: envId
      in: path
      required: true
      description: >-
        The environment's UUID (from GET /me). Access follows the caller's
        role in the environment's workspace. An environment of a workspace the
        caller doesn't belong to, an unknown one, or anything that isn't a UUID
        answers 404 ENVIRONMENT_NOT_FOUND, never 403.
      schema: { type: string, format: uuid, example: 3f2b6c1e-0000-4000-8000-000000000001 }
    WsPath:
      name: wsId
      in: path
      required: true
      description: >-
        The workspace's UUID. Only honoured for members: anyone else gets 404
        WORKSPACE_NOT_FOUND.
      schema: { type: string, format: uuid }
    FlagKeyPath:
      name: key
      in: path
      required: true
      schema: { type: string, example: new-checkout }
    ExperimentKeyPath:
      name: key
      in: path
      required: true
      schema: { type: string, example: checkout-test }

  responses:
    ExperimentNotFound:
      description: EXPERIMENT_NOT_FOUND or ENVIRONMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: INVALID_REQUEST
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: UNAUTHORIZED — missing, invalid, or expired credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: FORBIDDEN — the caller's role in {envId} is too low
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    WorkspaceNotFound:
      description: WORKSPACE_NOT_FOUND (unknown, or the caller isn't a member)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    FlagNotFound:
      description: FLAG_NOT_FOUND or ENVIRONMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FLAG_KEY_EXISTS }
        message: { type: string }

    Role:
      type: string
      enum: [viewer, editor, approver, admin]

    WorkspaceRole:
      type: string
      enum: [owner, admin, editor, viewer]
      description: >-
        Applies to every environment of the workspace. Owners and admins can do
        everything flags allow (including production); editors edit outside
        production and can kill anywhere; viewers read. Only owners and admins
        manage members, invites, SDK keys and the workspace name.

    Environment:
      type: object
      required: [id, key, name, isProduction]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$', description: Never UUID-shaped. }
        name: { type: string }
        isProduction: { type: boolean }

    Workspace:
      type: object
      required: [id, name, slug, role, environments]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        environments:
          type: array
          items: { $ref: "#/components/schemas/Environment" }

    NameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    Me:
      type: object
      required: [id, email, activeWorkspaceId, workspaces, invites]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        activeWorkspaceId: { type: string, format: uuid }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        invites:
          type: array
          description: Open invites addressed to the caller's email. They never carry a token.
          items:
            type: object
            required: [id, workspaceId, workspaceName, role, invitedByEmail, expiresAt]
            properties:
              id: { type: string, format: uuid }
              workspaceId: { type: string, format: uuid }
              workspaceName: { type: string }
              role: { $ref: "#/components/schemas/WorkspaceRole" }
              invitedByEmail: { type: string }
              expiresAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, email, role, joinedAt, isYou]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }
        isYou: { type: boolean }

    Invite:
      type: object
      required: [id, email, role, invitedByEmail, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        invitedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    SdkKey:
      type: object
      required: [id, name, kind, prefix, createdAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [sdk] }
        prefix: { type: string, example: hsdk_1a2b3c4d }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }

    Variation:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { description: "Must match the flag's variationType; at most 4 KB" }

    FlagCreateRequest:
      type: object
      required: [key, name, variationType, variations]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" }
        name: { type: string }
        description: { type: string }
        variationType:
          type: string
          enum: [boolean, string, number, json]
        variations:
          type: array
          minItems: 2
          maxItems: 20
          description: Order matters — it defines rollout bucket ranges.
          items: { $ref: "#/components/schemas/Variation" }

    Clause:
      type: object
      required: [attribute, operator]
      description: >-
        A missing or null context attribute makes every operator false
        (US-02 AC-2).
      properties:
        attribute: { type: string }
        operator:
          type: string
          enum: [equals, in, contains, greaterThan, exists]
        value: { description: "Scalar for equals/contains, non-empty array for in, number for greaterThan; ignored for exists" }

    TargetingRule:
      type: object
      required: [clauses, variationId]
      description: All clauses must match. Rules evaluate top-down; first match wins.
      properties:
        clauses:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Clause" }
        variationId: { type: string }

    FlagConfigUpdateRequest:
      type: object
      minProperties: 1
      properties:
        enabled: { type: boolean }
        targetingRules:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TargetingRule" }
        rollout:
          type: [object, "null"]
          description: variationId -> integer basis points, summing to exactly 100000
          additionalProperties: { type: integer, minimum: 0 }
        fallthroughVariationId: { type: string }

    ExperimentStatus:
      type: string
      enum: [draft, running, stopped]

    ExperimentMetric:
      type: object
      required: [name, eventName, type, isPrimary]
      properties:
        name: { type: string, maxLength: 128 }
        eventName:
          type: string
          description: Must not start with "$" (reserved for Helios events such as $exposure).
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
        type:
          type: string
          description: conversion counts once per subject; value records every event with a numeric value.
          enum: [conversion, value]
        isPrimary: { type: boolean }

    ExperimentCreateRequest:
      type: object
      required: [flagKey, key, name, metrics]
      properties:
        flagKey: { type: string }
        key: { type: string, description: Same rules as a flag key, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' }
        name: { type: string, maxLength: 200 }
        hypothesis: { type: string, maxLength: 2000 }
        metrics:
          type: array
          minItems: 1
          maxItems: 10
          description: Exactly one must be primary; names and eventNames must be unique.
          items: { $ref: "#/components/schemas/ExperimentMetric" }

    Experiment:
      type: object
      required: [id, key, name, hypothesis, flagKey, environment, status, startedAt, stoppedAt, metrics, configChangedSinceStart, createdAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        hypothesis: { type: string }
        flagKey: { type: string }
        environment: { type: string }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        startedAt: { type: [string, "null"], format: date-time }
        stoppedAt: { type: [string, "null"], format: date-time }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ExperimentMetric" }
        configChangedSinceStart:
          type: boolean
          description: >-
            The flag's targeting, rollout or fallthrough in this environment
            differs from when the experiment started (or, once stopped, from
            when it stopped). Informational; flag edits are not blocked.
        createdAt: { type: string, format: date-time }

    Flag:
      type: object
      description: A flag's definition plus its config in one environment.
      required: [key, name, description, variationType, variations, environment, config, createdAt, updatedAt]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        variationType: { type: string, enum: [boolean, string, number, json] }
        variations:
          type: array
          items: { $ref: "#/components/schemas/Variation" }
        environment: { type: string }
        config:
          type: object
          required: [enabled, targetingRules, rollout, fallthroughVariationId, version, updatedAt]
          properties:
            enabled: { type: boolean }
            targetingRules:
              type: array
              items: { $ref: "#/components/schemas/TargetingRule" }
            rollout:
              type: [object, "null"]
              additionalProperties: { type: integer }
            fallthroughVariationId: { type: string }
            version: { type: integer, description: Bumped on every change }
            updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      required: [id, createdAt, actorEmail, action, resourceType, resourceId, severity, diffBefore, diffAfter, scope]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        actorEmail: { type: string }
        action: { type: string, example: flag.kill }
        resourceType: { type: string, example: flag }
        resourceId: { type: string, example: ui-test-flag }
        severity: { type: string, enum: [info, critical] }
        diffBefore: { description: State before the change; null when the resource did not exist }
        diffAfter: { description: State after the change; null when the resource no longer exists }
        scope:
          type: string
          enum: [environment, global]
          description: global = not tied to one environment (flag.create); shown in every environment's log.

    AuditLogList:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        nextCursor:
          type: [integer, "null"]
          format: int64
          description: Pass as `before` for the next page; null when there are no more entries.

    EvaluationContext:
      type: object
      required: [subjectKey]
      properties:
        subjectKey: { type: string }
        attributes:
          type: object
          additionalProperties: true

    EvaluationResult:
      type: object
      required: [flagKey, variationId, value, reason, experimentId]
      properties:
        flagKey: { type: string }
        variationId: { type: [string, "null"] }
        value: { description: "null when no variation applies — serve your fallback" }
        reason:
          type: string
          enum: [TARGETING_MATCH, ROLLOUT, FALLTHROUGH, FLAG_DISABLED, FLAG_NOT_FOUND, TYPE_MISMATCH]
        experimentId: { type: [string, "null"] }
