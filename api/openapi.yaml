openapi: 3.1.0
info:
  title: Helios API
  version: 0.2.0
  description: >-
    Shared contract for the Helios control plane (flag CRUD, RBAC, audit) and
    data plane (flag evaluation). This file is the source of truth for the API
    shape: backend handlers under /backend and the frontend API client under
    /frontend are both expected to conform to it.

    Control-plane routes take a Supabase Auth access token and check the
    caller's role in {env} (viewer < editor < approver < admin). Every non-2xx
    JSON response has the Error shape.
servers:
  - url: https://TODO-your-render-service.onrender.com
    description: Production (Render)
  - url: http://localhost:8080
    description: Local development (Go backend)

tags:
  - name: system
  - name: control-plane
  - name: data-plane

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe — 200 only if the database is reachable
      security: []
      responses:
        "200":
          description: Service is up and the database answered a ping
          content:
            text/plain:
              schema: { type: string, example: ok }
        "503":
          description: Database unreachable
          content:
            text/plain:
              schema: { type: string, example: db unreachable }

  /me:
    get:
      tags: [control-plane]
      summary: The current user and their role in each environment
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /environments/{env}/members:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    post:
      tags: [control-plane]
      summary: Grant or change a user's role in this environment (admin)
      description: >-
        The user must already have signed up through Supabase Auth. Identify
        them by exactly one of userId or email. Demoting the environment's
        last admin is refused with 409 LAST_ADMIN.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpsertRequest" }
      responses:
        "201":
          description: Role granted or changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "USER_NOT_FOUND or ENVIRONMENT_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: LAST_ADMIN, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{env}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [control-plane]
      summary: Remove a user's role in this environment (admin)
      security: [{ supabaseJWT: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: MEMBER_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: LAST_ADMIN, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{env}/flags:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List flags with their config in this environment (any role)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Flags, ordered by key
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: array
                    items: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [control-plane]
      summary: Create a flag (editor+)
      description: >-
        The flag is created in every environment, disabled everywhere, so
        creation never changes user-visible behaviour (US-01 AC-1).
        Fallthrough defaults to the first variation.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagCreateRequest" }
      responses:
        "201":
          description: Created; returned with its config in {env}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { description: "INVALID_REQUEST, or TYPE_MISMATCH when a variation value doesn't match variationType", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: FLAG_KEY_EXISTS, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{env}/flags/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    get:
      tags: [control-plane]
      summary: Get one flag's config in this environment (any role)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: The flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    patch:
      tags: [control-plane]
      summary: Update the flag's config in this environment
      description: >-
        Editor+ in non-production environments; approver+ in production.
        Absent fields are unchanged; targetingRules or rollout set to null are
        cleared. Lowering a rollout revokes access already granted, so the
        console should warn before saving that (US-03 AC-3).
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagConfigUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    delete:
      tags: [control-plane]
      summary: Delete the flag from every environment (admin)
      description: >-
        A flag's definition is shared across environments, so this removes it
        everywhere and therefore requires admin in every environment, not
        just {env}. Refused with 409 IN_USE while the flag is enabled with
        targeting rules anywhere, unless force=true. Refused with 409
        HAS_RUNNING_EXPERIMENT while any environment has a running experiment
        on the flag, even with force=true; stop the experiment first.
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: "IN_USE, or HAS_RUNNING_EXPERIMENT (not bypassed by force)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{env}/flags/{key}/kill:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/FlagKeyPath"
    post:
      tags: [control-plane]
      summary: Emergency kill — disable the flag in this environment (editor+, any environment)
      description: >-
        Allowed for editors even in production: a blocked kill during an
        incident costs more than an unnecessary one (US-06). Idempotent, and
        audited at severity=critical on every call (US-08).
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Flag is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }

  /environments/{env}/audit-logs:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: Read the audit log for this environment (any role)
      description: >-
        Newest first (id descending), keyset-paginated: pass the previous
        page's nextCursor as `before` to get the next page. Read-only.

        Returns entries recorded against {env}, plus entries that belong to
        no single environment, marked `scope: global`. Today that is
        flag.create, because a flag is created in every environment at once,
        so those entries appear in every environment's log.

        Diffs are returned exactly as recorded. Writers redact API keys
        (api_key.create stores "[REDACTED]"), but flag and member diffs
        contain whatever the user entered, such as variation values,
        targeting-rule values and member emails.
      security: [{ supabaseJWT: [] }]
      parameters:
        - name: limit
          in: query
          description: Page size. Values above 200 are clamped to 200.
          schema: { type: integer, minimum: 1, default: 50 }
        - name: before
          in: query
          description: Cursor. Return only entries with id less than this.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: action
          in: query
          description: Exact match, e.g. flag.kill
          schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        - name: resourceType
          in: query
          description: Exact match, e.g. flag or member
          schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        - name: resourceId
          in: query
          description: Exact match, e.g. a flag key or a user id
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: severity
          in: query
          schema: { type: string, enum: [info, critical] }
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: ENVIRONMENT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # --- Experiments -------------------------------------------------------
  # Planned, not yet paths: POST /track (SDK-key authenticated event
  # ingestion, including the reserved "$exposure" event) and
  # GET /environments/{env}/experiments/{key}/results.

  /environments/{env}/experiments:
    parameters: [{ $ref: "#/components/parameters/EnvPath" }]
    get:
      tags: [control-plane]
      summary: List experiments in this environment (any role)
      description: Newest first, capped at 200 rows (not paginated yet).
      security: [{ supabaseJWT: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ExperimentStatus" } }
        - { name: flagKey, in: query, schema: { type: string } }
      responses:
        "200":
          description: Experiments
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [control-plane]
      summary: Create a draft experiment (editor+)
      description: >-
        Creates a draft on one flag in {env}. It does not affect evaluation
        until started. The flag must have at least 2 variations. Metric
        eventName values starting with "$" are reserved and rejected.
      security: [{ supabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "409": { description: EXPERIMENT_KEY_EXISTS, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{env}/experiments/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    get:
      tags: [control-plane]
      summary: Get one experiment (any role)
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }

  /environments/{env}/experiments/{key}/start:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    post:
      tags: [control-plane]
      summary: Start a draft experiment (editor+)
      description: >-
        Requires the flag to be enabled in {env}. Records the flag's current
        targeting, rollout and fallthrough so later edits can be reported as
        configChangedSinceStart. Editing the flag while the experiment runs is
        not blocked.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: "INVALID_TRANSITION (not a draft), FLAG_DISABLED, or EXPERIMENT_ALREADY_RUNNING (another experiment is running on this flag in {env})", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /environments/{env}/experiments/{key}/stop:
    parameters:
      - $ref: "#/components/parameters/EnvPath"
      - $ref: "#/components/parameters/ExperimentKeyPath"
    post:
      tags: [control-plane]
      summary: Stop a running experiment (approver+)
      description: Stopped is terminal; run a new experiment to measure again.
      security: [{ supabaseJWT: [] }]
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { description: INVALID_TRANSITION (not running), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /evaluate:
    post:
      tags: [data-plane]
      summary: Evaluate 1-100 flags for a context
      description: >-
        Authenticated by SDK key, not user JWT; the key decides the
        environment. A flag that's missing or disabled comes back with a null
        value and the caller serves its own fallback. Any non-200 (including
        503) also means "serve fallback".
      security: [{ sdkKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, flagKeys]
              properties:
                context: { $ref: "#/components/schemas/EvaluationContext" }
                flagKeys:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
      responses:
        "200":
          description: One result per requested key, in request order
          content:
            application/json:
              schema:
                type: object
                required: [evaluations]
                properties:
                  evaluations:
                    type: array
                    items: { $ref: "#/components/schemas/EvaluationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "EVALUATION_UNAVAILABLE — serve fallbacks", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /sdk/stream:
    get:
      tags: [data-plane]
      summary: Server-Sent Events feed of flag-change notifications
      description: >-
        Authenticated by SDK key, same as /evaluate — the key decides the
        environment. Purely a propagation optimization: if unavailable
        (no broker configured, or it's unreachable), this fails fast with
        503 rather than hanging, and the SDK should fall back to polling
        /evaluate. /evaluate's correctness never depends on this endpoint.
      security: [{ sdkKey: [] }]
      responses:
        "200":
          description: >-
            text/event-stream. Each event is `event: flag_update` with a
            JSON data payload: {action, flagKey, enabled, version}. This
            shape is a change notification, not the full flag state — treat
            it as a cue to re-fetch, not as authoritative data.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: STREAM_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    supabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase Auth access token (ES256 or RS256), verified against the
        project's public keys at <SUPABASE_URL>/auth/v1/.well-known/jwks.json.
        HS256 tokens, the anon key, and service_role tokens are rejected.
    sdkKey:
      type: apiKey
      in: header
      name: X-Helios-SDK-Key

  parameters:
    EnvPath:
      name: env
      in: path
      required: true
      schema: { type: string, example: production }
    FlagKeyPath:
      name: key
      in: path
      required: true
      schema: { type: string, example: new-checkout }
    ExperimentKeyPath:
      name: key
      in: path
      required: true
      schema: { type: string, example: checkout-test }

  responses:
    ExperimentNotFound:
      description: EXPERIMENT_NOT_FOUND or ENVIRONMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: INVALID_REQUEST
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: UNAUTHORIZED — missing, invalid, or expired credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: FORBIDDEN — the caller's role in {env} is too low
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    FlagNotFound:
      description: FLAG_NOT_FOUND or ENVIRONMENT_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FLAG_KEY_EXISTS }
        message: { type: string }

    Role:
      type: string
      enum: [viewer, editor, approver, admin]

    Me:
      type: object
      required: [id, email, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        roles:
          type: array
          items:
            type: object
            required: [environment, role]
            properties:
              environment: { type: string }
              role: { $ref: "#/components/schemas/Role" }

    MemberUpsertRequest:
      type: object
      required: [role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Member:
      type: object
      required: [userId, email, environment, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        environment: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Variation:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { description: "Must match the flag's variationType; at most 4 KB" }

    FlagCreateRequest:
      type: object
      required: [key, name, variationType, variations]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" }
        name: { type: string }
        description: { type: string }
        variationType:
          type: string
          enum: [boolean, string, number, json]
        variations:
          type: array
          minItems: 2
          maxItems: 20
          description: Order matters — it defines rollout bucket ranges.
          items: { $ref: "#/components/schemas/Variation" }

    Clause:
      type: object
      required: [attribute, operator]
      description: >-
        A missing or null context attribute makes every operator false
        (US-02 AC-2).
      properties:
        attribute: { type: string }
        operator:
          type: string
          enum: [equals, in, contains, greaterThan, exists]
        value: { description: "Scalar for equals/contains, non-empty array for in, number for greaterThan; ignored for exists" }

    TargetingRule:
      type: object
      required: [clauses, variationId]
      description: All clauses must match. Rules evaluate top-down; first match wins.
      properties:
        clauses:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Clause" }
        variationId: { type: string }

    FlagConfigUpdateRequest:
      type: object
      minProperties: 1
      properties:
        enabled: { type: boolean }
        targetingRules:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TargetingRule" }
        rollout:
          type: [object, "null"]
          description: variationId -> integer basis points, summing to exactly 100000
          additionalProperties: { type: integer, minimum: 0 }
        fallthroughVariationId: { type: string }

    ExperimentStatus:
      type: string
      enum: [draft, running, stopped]

    ExperimentMetric:
      type: object
      required: [name, eventName, type, isPrimary]
      properties:
        name: { type: string, maxLength: 128 }
        eventName:
          type: string
          description: Must not start with "$" (reserved for Helios events such as $exposure).
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
        type:
          type: string
          description: conversion counts once per subject; value records every event with a numeric value.
          enum: [conversion, value]
        isPrimary: { type: boolean }

    ExperimentCreateRequest:
      type: object
      required: [flagKey, key, name, metrics]
      properties:
        flagKey: { type: string }
        key: { type: string, description: Same rules as a flag key, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' }
        name: { type: string, maxLength: 200 }
        hypothesis: { type: string, maxLength: 2000 }
        metrics:
          type: array
          minItems: 1
          maxItems: 10
          description: Exactly one must be primary; names and eventNames must be unique.
          items: { $ref: "#/components/schemas/ExperimentMetric" }

    Experiment:
      type: object
      required: [id, key, name, hypothesis, flagKey, environment, status, startedAt, stoppedAt, metrics, configChangedSinceStart, createdAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        hypothesis: { type: string }
        flagKey: { type: string }
        environment: { type: string }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        startedAt: { type: [string, "null"], format: date-time }
        stoppedAt: { type: [string, "null"], format: date-time }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ExperimentMetric" }
        configChangedSinceStart:
          type: boolean
          description: >-
            The flag's targeting, rollout or fallthrough in this environment
            differs from when the experiment started (or, once stopped, from
            when it stopped). Informational; flag edits are not blocked.
        createdAt: { type: string, format: date-time }

    Flag:
      type: object
      description: A flag's definition plus its config in one environment.
      required: [key, name, description, variationType, variations, environment, config, createdAt, updatedAt]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        variationType: { type: string, enum: [boolean, string, number, json] }
        variations:
          type: array
          items: { $ref: "#/components/schemas/Variation" }
        environment: { type: string }
        config:
          type: object
          required: [enabled, targetingRules, rollout, fallthroughVariationId, version, updatedAt]
          properties:
            enabled: { type: boolean }
            targetingRules:
              type: array
              items: { $ref: "#/components/schemas/TargetingRule" }
            rollout:
              type: [object, "null"]
              additionalProperties: { type: integer }
            fallthroughVariationId: { type: string }
            version: { type: integer, description: Bumped on every change }
            updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      required: [id, createdAt, actorEmail, action, resourceType, resourceId, severity, diffBefore, diffAfter, scope]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        actorEmail: { type: string }
        action: { type: string, example: flag.kill }
        resourceType: { type: string, example: flag }
        resourceId: { type: string, example: ui-test-flag }
        severity: { type: string, enum: [info, critical] }
        diffBefore: { description: State before the change; null when the resource did not exist }
        diffAfter: { description: State after the change; null when the resource no longer exists }
        scope:
          type: string
          enum: [environment, global]
          description: global = not tied to one environment (flag.create); shown in every environment's log.

    AuditLogList:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        nextCursor:
          type: [integer, "null"]
          format: int64
          description: Pass as `before` for the next page; null when there are no more entries.

    EvaluationContext:
      type: object
      required: [subjectKey]
      properties:
        subjectKey: { type: string }
        attributes:
          type: object
          additionalProperties: true

    EvaluationResult:
      type: object
      required: [flagKey, variationId, value, reason, experimentId]
      properties:
        flagKey: { type: string }
        variationId: { type: [string, "null"] }
        value: { description: "null when no variation applies — serve your fallback" }
        reason:
          type: string
          enum: [TARGETING_MATCH, ROLLOUT, FALLTHROUGH, FLAG_DISABLED, FLAG_NOT_FOUND, TYPE_MISMATCH]
        experimentId: { type: [string, "null"] }
